interface:
  display_name: "Review Loop"
  short_description: "Fresh-context PR review/fix loop"
  default_prompt: "Use $review-loop to run an iterative fresh-context PR review/fix loop. This authorizes the orchestrator to request clean-context read-only reviewers when supported, post consolidated Agent Review comments, commit and push only `auto-fix` and explicit `user-approved-fix` fixes to this PR branch, produce a temporary HTML report, and mark the PR ready for human review only when clean-context review-loop convergence leaves no unresolved `auto-fix` or `ask-user` blockers after parent adjudication."
