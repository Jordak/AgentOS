name: AgentOS Validation

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  branch-hygiene:
    name: Check PR branch hygiene
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Check out PR head
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Reject merge commits in PR branch
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          git fetch --no-tags --prune origin "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"
          merge_commits="$(git rev-list --merges --oneline "origin/${BASE_REF}..HEAD")"
          if [ -n "$merge_commits" ]; then
            echo "::error title=Merge commits found in PR branch::Rebase this branch onto origin/${BASE_REF}; do not merge ${BASE_REF} into the PR branch."
            echo
            echo "Merge commits found:"
            echo "$merge_commits"
            printf '%s\n' \
              "" \
              "Remediation:" \
              "  git switch <feature-branch>" \
              "  git branch backup/<feature-branch>-before-rebase" \
              "  git fetch origin" \
              "  git rebase origin/${BASE_REF}" \
              "  # resolve conflicts if prompted, then run:" \
              "  scripts/run-validator" \
              "  scripts/agent-push --force-with-lease origin <feature-branch>"
            exit 1
          fi

  pr-readiness:
    name: Check PR design readiness fields
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest

    steps:
      - name: Require visible design readiness
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          body_file="${RUNNER_TEMP}/pr-body.md"
          printf '%s' "${PR_BODY}" > "${body_file}"

          readiness_evidence="$(sed -n 's/^Readiness evidence:[[:space:]]*//p' "${body_file}" | head -n 1)"
          readiness_verdict="$(sed -n 's/^Readiness verdict:[[:space:]]*//p' "${body_file}" | head -n 1)"

          if [ -z "${readiness_evidence}" ]; then
            echo "::error title=Missing readiness evidence::PRs must expose readiness evidence in the PR body. Add 'Readiness evidence: <GitHub issue, PRD, ADR, local design doc, or gate-skip reason>'."
            exit 1
          fi

          case "${readiness_verdict}" in
            "Ready to Implement"|"Gate Skipped")
              ;;
            "")
              echo "::error title=Missing readiness verdict::Add 'Readiness verdict: Ready to Implement' or 'Readiness verdict: Gate Skipped' to the PR body."
              exit 1
              ;;
            *)
              echo "::error title=Unsupported readiness verdict::Use exactly 'Ready to Implement' or 'Gate Skipped'."
              exit 1
              ;;
          esac

  validate:
    name: Validate public boundary
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks.tar.gz
          gitleaks version

      - name: Run AgentOS validator
        run: scripts/run-validator

      - name: Run AgentOS validator self-test
        run: scripts/run-validator --self-test

      - name: Run global instruction installer self-test
        run: python3 scripts/install_global_agent_instructions.py --self-test

      - name: Run AgentOS doctor self-test
        run: python3 os/skills/run-agentos-doctor/scripts/agentos_doctor.py --self-test

      - name: Run benchmark step summary renderer self-test
        run: python3 os/verification/scripts/render_benchmark_step_summary.py --self-test

      - name: Run stale-instruction audit
        run: scripts/audit_agentos_leak_paths.sh

      - name: Scan committed publication tree
        run: scripts/check_publication_tree_secrets.sh HEAD

      - name: Scan staged publication snapshot
        run: scripts/check_staged_publication_secrets.sh
