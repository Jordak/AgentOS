name: Guidance Benchmark Trial

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guidance:
    name: Run Guidance benchmark trial
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: guidance-benchmark-trial
    permissions:
      contents: read
    outputs:
      refresh_status: ${{ steps.refresh.outputs.refresh_status }}
      public_refresh_candidate: ${{ steps.public_refresh.outputs.public_refresh_candidate }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare remote-fresh main branch
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          git switch -C main origin/main
          git branch --set-upstream-to=origin/main main
          git status --short --branch

      - name: Configure benchmark temp paths
        run: |
          set -euo pipefail
          {
            echo "CODEX_HOME=${RUNNER_TEMP}/codex-home"
            echo "GUIDANCE_RUN_JSON=${RUNNER_TEMP}/guidance-run.json"
            echo "GUIDANCE_REFRESH_JSON=${RUNNER_TEMP}/guidance-refresh.json"
          } >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Check model-call secret
        env:
          CODEX_OPENAI_API_KEY: ${{ secrets.CODEX_OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$CODEX_OPENAI_API_KEY" ]; then
            echo "::error title=Missing CODEX_OPENAI_API_KEY::Configure CODEX_OPENAI_API_KEY in the guidance-benchmark-trial environment before running this workflow."
            exit 1
          fi

      - name: Start Codex proxy
        # openai/codex-action v1, resolved 2026-06-04.
        uses: openai/codex-action@a26d2d4d8b78a694338b8e3715c3630254340b2c
        with:
          openai-api-key: ${{ secrets.CODEX_OPENAI_API_KEY }}
          codex-home: ${{ runner.temp }}/codex-home
          safety-strategy: drop-sudo

      - name: Run Codex preflight
        id: codex_preflight
        run: |
          set -uo pipefail
          preflight_stdout="${RUNNER_TEMP}/guidance-codex-preflight.stdout"
          preflight_stderr="${RUNNER_TEMP}/guidance-codex-preflight.stderr"
          preflight_message="${RUNNER_TEMP}/guidance-codex-preflight-message.txt"
          set +e
          timeout 120s codex exec \
            --cd "$GITHUB_WORKSPACE" \
            --skip-git-repo-check \
            --sandbox read-only \
            --ephemeral \
            --color never \
            --output-last-message "$preflight_message" \
            --model gpt-5.5 \
            --config 'model_reasoning_effort="low"' \
            "Reply with exactly OK." \
            > "$preflight_stdout" \
            2> "$preflight_stderr"
          preflight_status=$?
          set -e
          python3 os/verification/scripts/classify_codex_preflight.py \
            --exit-code "$preflight_status" \
            --stdout "$preflight_stdout" \
            --stderr "$preflight_stderr" \
            --raw-response "$preflight_message" \
            --github-output "$GITHUB_OUTPUT"

      - name: Run Guidance benchmark
        if: steps.codex_preflight.outputs.preflight_status == '0'
        id: benchmark
        run: |
          set -uo pipefail
          set +e
          python3 os/verification/guidance/scripts/benchmark_guidance.py \
            --no-dry-run \
            --harness codex \
            --judge-harness codex \
            --model gpt-5.5 \
            --effort low \
            --judge-model gpt-5.5 \
            --judge-effort low \
            --allow-harness-user-config \
            --check-remote-main \
            --quiet \
            --output "$GUIDANCE_RUN_JSON"
          benchmark_status=$?
          set -e
          echo "benchmark_status=$benchmark_status" >> "$GITHUB_OUTPUT"

      - name: Generate public-safe refresh candidate
        if: always()
        id: refresh
        run: |
          set -uo pipefail
          set +e
          if [ -s "$GUIDANCE_RUN_JSON" ]; then
            python3 os/verification/scripts/refresh_benchmark_status.py \
              --report "$GUIDANCE_RUN_JSON" \
              > "$GUIDANCE_REFRESH_JSON"
            refresh_status=$?
          else
            refresh_status=1
          fi
          set -e
          echo "refresh_status=$refresh_status" >> "$GITHUB_OUTPUT"

      - name: Write public-safe step summary
        if: always()
        env:
          PREFLIGHT_STATUS: ${{ steps.codex_preflight.outputs.preflight_status }}
          PREFLIGHT_DIAGNOSIS: ${{ steps.codex_preflight.outputs.preflight_diagnosis }}
          PREFLIGHT_RESPONSE_STATUS: ${{ steps.codex_preflight.outputs.preflight_response_status }}
          BENCHMARK_STATUS: ${{ steps.benchmark.outputs.benchmark_status }}
          REFRESH_STATUS: ${{ steps.refresh.outputs.refresh_status }}
        run: |
          set -euo pipefail
          {
            echo "## Codex Preflight"
            echo
            echo "- Exit status: \`${PREFLIGHT_STATUS:-unknown}\`"
            echo "- Public diagnosis: \`${PREFLIGHT_DIAGNOSIS:-unknown}\`"
            echo "- Response status: \`${PREFLIGHT_RESPONSE_STATUS:-unknown}\`"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -s "$GUIDANCE_REFRESH_JSON" ]; then
            python3 os/verification/scripts/render_benchmark_step_summary.py "$GUIDANCE_REFRESH_JSON" >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "## Guidance Benchmark Trial"
              echo
              if [ "${PREFLIGHT_STATUS:-}" != "0" ]; then
                echo "The full benchmark was skipped because the Codex preflight did not pass."
              else
                echo "No public-safe refresh summary was generated. Inspect the failed workflow step logs."
              fi
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          {
            echo
            echo "### Workflow Outcome"
            echo
            echo "- Benchmark exit status: \`${BENCHMARK_STATUS:-unknown}\`"
            echo "- Refresh helper exit status: \`${REFRESH_STATUS:-unknown}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Prepare public-safe status handoff
        if: steps.refresh.outputs.refresh_status == '0'
        id: public_refresh
        run: |
          set -euo pipefail
          python3 - "$GUIDANCE_REFRESH_JSON" "$GITHUB_OUTPUT" <<'PY'
          import json
          import sys
          from pathlib import Path

          source = Path(sys.argv[1])
          output = Path(sys.argv[2])
          data = json.loads(source.read_text(encoding="utf-8"))
          public_safe = data.get("public_safe")
          if not isinstance(public_safe, dict):
              raise SystemExit("refresh candidate is missing public_safe")
          compact = json.dumps(
              {
                  "version": data.get("version"),
                  "generated_at": data.get("generated_at"),
                  "public_safe": public_safe,
              },
              separators=(",", ":"),
              sort_keys=True,
          )
          with output.open("a", encoding="utf-8") as handle:
              print("public_refresh_candidate<<AGENTOS_PUBLIC_REFRESH", file=handle)
              print(compact, file=handle)
              print("AGENTOS_PUBLIC_REFRESH", file=handle)
          PY

      - name: Enforce Codex preflight result
        if: steps.codex_preflight.outputs.preflight_status != '' && steps.codex_preflight.outputs.preflight_status != '0'
        env:
          PREFLIGHT_STATUS: ${{ steps.codex_preflight.outputs.preflight_status }}
          PREFLIGHT_DIAGNOSIS: ${{ steps.codex_preflight.outputs.preflight_diagnosis }}
        run: |
          echo "::error title=Codex preflight failed::codex exec smoke test exited with status ${PREFLIGHT_STATUS}; public diagnosis: ${PREFLIGHT_DIAGNOSIS:-unknown}."
          exit "$PREFLIGHT_STATUS"

      - name: Enforce benchmark result
        if: steps.codex_preflight.outputs.preflight_status == '0' && steps.benchmark.outputs.benchmark_status != '' && steps.benchmark.outputs.benchmark_status != '0' && steps.refresh.outputs.refresh_status != '0'
        env:
          BENCHMARK_STATUS: ${{ steps.benchmark.outputs.benchmark_status }}
        run: |
          echo "::error title=Guidance benchmark did not produce a fresh public-safe candidate::benchmark_guidance.py exited with status ${BENCHMARK_STATUS}. See the public-safe step summary for structured details."
          exit "$BENCHMARK_STATUS"

      - name: Enforce refresh candidate result
        if: steps.benchmark.outputs.benchmark_status == '0' && steps.refresh.outputs.refresh_status != '' && steps.refresh.outputs.refresh_status != '0'
        env:
          REFRESH_STATUS: ${{ steps.refresh.outputs.refresh_status }}
        run: |
          echo "::error title=No fresh public-safe Guidance candidate::refresh-benchmark-status helper exited with status ${REFRESH_STATUS}."
          exit "$REFRESH_STATUS"

      - name: Clean up temporary benchmark JSON
        if: always()
        run: |
          rm -f "$GUIDANCE_RUN_JSON" "$GUIDANCE_REFRESH_JSON" \
            "${RUNNER_TEMP}/guidance-codex-preflight.stdout" \
            "${RUNNER_TEMP}/guidance-codex-preflight.stderr" \
            "${RUNNER_TEMP}/guidance-codex-preflight-message.txt"

  status-pr:
    name: Open Guidance benchmark status PR
    needs: guidance
    if: ${{ always() && github.ref_name == 'main' && needs.guidance.outputs.refresh_status == '0' && needs.guidance.outputs.public_refresh_candidate != '' }}
    runs-on: ubuntu-latest
    environment: guidance-benchmark-trial
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare remote-fresh main branch
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin "+refs/heads/main:refs/remotes/origin/main"
          git switch -C main origin/main
          git branch --set-upstream-to=origin/main main

      - name: Configure status temp path
        run: |
          set -euo pipefail
          echo "GUIDANCE_PUBLIC_REFRESH_JSON=${RUNNER_TEMP}/guidance-public-refresh.json" >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Restore public-safe status candidate
        env:
          PUBLIC_REFRESH_CANDIDATE: ${{ needs.guidance.outputs.public_refresh_candidate }}
        run: |
          set -euo pipefail
          printf '%s' "$PUBLIC_REFRESH_CANDIDATE" > "$GUIDANCE_PUBLIC_REFRESH_JSON"

      - name: Apply benchmark status refresh
        id: apply_status
        run: |
          set -euo pipefail
          writer_revision="$(git rev-parse HEAD)"
          python3 os/verification/scripts/apply_benchmark_status_candidate.py \
            "$GUIDANCE_PUBLIC_REFRESH_JSON" \
            --expected-revision "$writer_revision"
          if git diff --quiet --exit-code -- os/verification/BENCHMARK_STATUS.md; then
            echo "status_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "status_changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open benchmark status pull request
        if: steps.apply_status.outputs.status_changed == 'true'
        id: status_pr
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          status_branch="codex/guidance-benchmark-status-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$status_branch"
          git add os/verification/BENCHMARK_STATUS.md
          git commit -m "Refresh Guidance benchmark status"
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${status_branch}"

          pr_body="${RUNNER_TEMP}/guidance-benchmark-status-pr.md"
          {
            echo "## Summary"
            echo
            echo "- Previously, the manual Guidance benchmark workflow rendered a public-safe summary without persisting the Core freshness snapshot."
            echo "- This PR updates \`os/verification/BENCHMARK_STATUS.md\` from the public-safe refresh candidate generated by a manual workflow run."
            echo "- Validation will show the status-file diff and the originating manual workflow run."
            echo
            echo "Readiness evidence: Gate skipped - generated benchmark status snapshot from manual workflow run ${RUN_URL}"
            echo "Readiness verdict: Gate Skipped"
            echo
            echo "## Validation"
            echo
            echo "- Manual Guidance benchmark workflow run: ${RUN_URL}"
            echo "- Public-safe refresh candidate applied to \`os/verification/BENCHMARK_STATUS.md\`"
          } > "$pr_body"

          gh pr create \
            --base main \
            --head "$status_branch" \
            --title "Refresh Guidance benchmark status" \
            --body-file "$pr_body"

      - name: Clean up public-safe status candidate
        if: always()
        run: |
          rm -f "$GUIDANCE_PUBLIC_REFRESH_JSON"
